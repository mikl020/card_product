<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="card-product">
        <article class="card">
            <div class="top">
                <p class="img"><img src="img/novax.png" alt="Nova X" class="img-product"></p>
                <h2>Nova X</h2>
                <p class="description">OLED-дисплей и двойная камера</p>
            </div>
            <div class="bottom">
                <span class="price">49 990 ₽</span>
                <span class="buttom"><a href="#!" class="click">Купить</a></span>
            </div>
        </article>
        <article class="card">
            <div class="top">
                <p class="img"><img src="img/sony.png" alt="Sonic Pro" class="img-product"></p>
                <h2>Sonic Pro</h2>
                <p class="description">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой быстрой зарядки и автономностью до 40 часов</p>
            </div>
            <div class="bottom">
                <span class="price">12 490 ₽</span>
                <span class="buttom"><a href="#!" class="click">Купить</a></span>
            </div>
        </article>
        <article class="card">
            <div class="top">
                <p class="img"><img src="img/watch.png" alt="" class="img-product"></p>
                <h2>Pulse Watch</h2>
                <p class="description">Умные часы для спорта и отслеживания активности</p>
            </div>
            <div class="bottom">
                <span class="price">18 990 ₽</span>
                <span class="buttom"><a href="#!" class="click">Купить</a></span>
            </div>
        </article>
    </div>
</body>
</html>
